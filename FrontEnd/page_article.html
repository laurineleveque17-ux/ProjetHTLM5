<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Détails de l'Article</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <header>
        <div class="header-side">
            <a href="index.html" class="btn-back">Retour à l'accueil</a>
        </div>
        
        <h1 class="header-title">Info5 - Détails</h1>
        
        <div class="header-side">
            </div>
    </header>

    <main id="article-container">
        <h1 id="article-title">Chargement...</h1>
        <div id="article-meta"></div>
        <div id="article-summary" class="summary-box">
            <h3>Résumé</h3>
            <p id="summary-text"></p>
        </div>
        
        <div id="article-content"></div>

        <div class="actions">
            <button id="source-link" class="btn-source">Lire l'article complet ↗</button>
        </div>

        <hr>

        <div class="reactions">
            <button id="like-btn" class="reaction-btn like">
                👍 <span id="like-count">0</span>
            </button>
            <button id="dislike-btn" class="reaction-btn dislike">
                👎 <span id="dislike-count">0</span>
            </button>
        </div>

        <section id="comments-wrapper">
            <h3>Commentaires</h3>
            <div id="comments-list">
                </div>
            <form id="comment-form">
                <textarea id="comment-input" placeholder="Ajouter un commentaire..." required></textarea>
                <button type="submit">Publier</button>
            </form>
        </section>
    </main>

    <script src="article-script.js"></script>
</body>
</html>
